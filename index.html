<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;

    font-family:Arial, Helvetica, sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    background:
        radial-gradient(
            circle at 50% 72%,
            rgba(255,72,190,.16),
            transparent 29%
        ),

        radial-gradient(
            circle at 16% 20%,
            rgba(70,100,255,.18),
            transparent 35%
        ),

        radial-gradient(
            circle at 84% 30%,
            rgba(111,77,255,.09),
            transparent 28%
        ),

        linear-gradient(
            180deg,
            #050817 0%,
            #0c1026 44%,
            #17132d 70%,
            #321238 100%
        );
}


/* =====================================================
   ESTRELLAS
===================================================== */

.stars{
    position:fixed;
    inset:0;

    z-index:1;

    pointer-events:none;
}

.star{
    position:absolute;

    width:2px;
    height:2px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 5px rgba(255,255,255,.95),
        0 0 12px rgba(197,210,255,.55);

    animation:
        twinkle 4s ease-in-out infinite;
}

.star.medium{
    width:3px;
    height:3px;
}

.star.big{
    width:4px;
    height:4px;

    box-shadow:
        0 0 7px white,
        0 0 15px rgba(188,199,255,.7),
        0 0 27px rgba(138,111,255,.35);
}

@keyframes twinkle{

    0%,
    100%{
        opacity:.22;
        transform:scale(.7);
    }

    50%{
        opacity:1;
        transform:scale(1.4);
    }
}


/* =====================================================
   ESTRELLAS EN FORMA DE DESTELLO
===================================================== */

.sparkle{
    position:absolute;

    width:12px;
    height:12px;

    opacity:.7;

    animation:
        sparklePulse 5s ease-in-out infinite;
}

.sparkle::before,
.sparkle::after{
    content:"";

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:100%;

    background:white;

    box-shadow:
        0 0 8px rgba(255,255,255,.7);
}

.sparkle::before{
    width:2px;
    height:12px;
}

.sparkle::after{
    width:12px;
    height:2px;
}

@keyframes sparklePulse{

    0%,
    100%{
        opacity:.25;
        transform:scale(.7);
    }

    50%{
        opacity:.9;
        transform:scale(1.15);
    }
}


/* =====================================================
   SOL SYNTHWAVE
===================================================== */

.retro-sun{
    position:fixed;

    left:50%;
    bottom:90px;

    width:430px;
    height:430px;

    transform:
        translateX(-50%);

    border-radius:50%;

    background:
        linear-gradient(
            180deg,
            rgba(255,174,105,.38) 0%,
            rgba(255,88,177,.28) 48%,
            rgba(173,65,217,.10) 78%,
            transparent 100%
        );

    box-shadow:
        0 0 50px rgba(255,86,186,.12),
        0 0 110px rgba(226,68,220,.10);

    filter:blur(.3px);

    opacity:.58;

    z-index:0;
}


/* líneas horizontales del sol */

.retro-sun::after{
    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    background:
        repeating-linear-gradient(
            180deg,
            transparent 0px,
            transparent 26px,
            rgba(5,8,23,.30) 27px,
            rgba(5,8,23,.30) 31px
        );

    mask-image:
        linear-gradient(
            180deg,
            transparent 0%,
            rgba(0,0,0,.8) 33%,
            black 100%
        );
}


/* =====================================================
   HORIZONTE NEÓN
===================================================== */

.horizon-light{
    position:fixed;

    left:0;
    right:0;

    bottom:135px;

    height:2px;

    opacity:.32;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(238,93,255,.9),
            rgba(255,128,209,1),
            rgba(238,93,255,.9),
            transparent
        );

    box-shadow:
        0 0 14px rgba(255,73,210,.55),
        0 0 35px rgba(149,74,255,.22);

    z-index:1;
}


/* =====================================================
   GRID OCHENTERA
===================================================== */

.retro-grid{
    position:fixed;

    left:-25%;
    right:-25%;

    bottom:-170px;

    height:330px;

    z-index:0;

    opacity:.13;

    transform:
        perspective(450px)
        rotateX(62deg);

    transform-origin:center top;

    background-image:

        linear-gradient(
            rgba(229,91,255,.55) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(103,112,255,.55) 1px,
            transparent 1px
        );

    background-size:
        42px 32px,
        42px 32px;

    mask-image:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.85),
            transparent 78%
        );
}


/* =====================================================
   NIEBLA NEÓN INFERIOR
===================================================== */

.neon-haze{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:250px;

    z-index:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at 50% 100%,
            rgba(255,52,190,.15),
            transparent 58%
        ),

        linear-gradient(
            transparent,
            rgba(171,41,161,.035),
            rgba(234,65,190,.085)
        );
}


/* =====================================================
   ESCENA
===================================================== */

.scene{
    position:relative;

    width:100%;
    min-height:100vh;

    z-index:5;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;
}


/* =====================================================
   GLOW DETRÁS DEL RAMO
===================================================== */

.bouquet-glow{
    position:absolute;

    width:520px;
    height:520px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,235,124,.13) 0%,
            rgba(255,93,192,.10) 38%,
            rgba(130,87,255,.05) 58%,
            transparent 73%
        );

    filter:blur(25px);

    animation:
        glowBreath 6s ease-in-out infinite;
}

@keyframes glowBreath{

    0%,
    100%{
        opacity:.65;
        transform:scale(.94);
    }

    50%{
        opacity:1;
        transform:scale(1.07);
    }
}


/* =====================================================
   RAMO
===================================================== */

.bouquet-wrapper{
    position:relative;

    width:min(510px,95vw);
    height:620px;

    opacity:0;

    transform-origin:
        50% 96%;

    animation:

        bouquetEnter
        2.2s
        cubic-bezier(.16,.82,.3,1)
        forwards,

        bouquetBreeze
        7s
        ease-in-out
        2.2s
        infinite;
}

@keyframes bouquetEnter{

    0%{
        opacity:0;

        transform:
            translateY(180px)
            scale(.86);
    }

    60%{
        opacity:1;
    }

    100%{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}

@keyframes bouquetBreeze{

    0%,
    100%{
        transform:rotate(-.65deg);
    }

    50%{
        transform:rotate(.8deg);
    }
}

.bouquet-svg{
    width:100%;
    height:100%;

    overflow:visible;

    filter:
        drop-shadow(
            0 21px 23px
            rgba(0,0,0,.28)
        );
}


/* =====================================================
   FLORES
===================================================== */

.flower{
    transform-box:fill-box;

    transform-origin:
        50% 100%;
}

.wind-a{
    animation:
        windA 5.1s ease-in-out infinite;
}

.wind-b{
    animation:
        windB 5.7s ease-in-out infinite;
}

.wind-c{
    animation:
        windC 4.8s ease-in-out infinite;
}

@keyframes windA{

    0%,
    100%{
        transform:rotate(-1.5deg);
    }

    50%{
        transform:
            rotate(2deg)
            translateY(-2px);
    }
}

@keyframes windB{

    0%,
    100%{
        transform:rotate(1deg);
    }

    50%{
        transform:rotate(-1.8deg);
    }
}

@keyframes windC{

    0%,
    100%{
        transform:rotate(-.4deg);
    }

    50%{
        transform:rotate(2.3deg);
    }
}


/* =====================================================
   HOJAS
===================================================== */

.leaf{
    transform-box:fill-box;

    transform-origin:center bottom;

    animation:
        leafWind 5.5s ease-in-out infinite;
}

@keyframes leafWind{

    0%,
    100%{
        transform:rotate(-1deg);
    }

    50%{
        transform:rotate(1.7deg);
    }
}


/* =====================================================
   PETALOS FLOTANDO
===================================================== */

.floating-petal{
    position:fixed;

    z-index:4;

    width:12px;
    height:19px;

    border-radius:
        70% 20% 70% 20%;

    background:
        linear-gradient(
            135deg,
            #fff17b,
            #eab323
        );

    opacity:0;

    filter:
        drop-shadow(
            0 0 4px
            rgba(255,225,93,.32)
        );

    animation:
        petalFall 9s linear infinite;
}

.petal-1{
    left:35%;
    top:19%;

    animation-delay:1s;
}

.petal-2{
    left:67%;
    top:28%;

    animation-delay:5s;
}

.petal-3{
    left:59%;
    top:14%;

    animation-delay:8s;
}

@keyframes petalFall{

    0%{
        opacity:0;

        transform:
            translate(0,-20px)
            rotate(0);
    }

    10%{
        opacity:.7;
    }

    65%{
        opacity:.55;
    }

    100%{
        opacity:0;

        transform:
            translate(55px,290px)
            rotate(270deg);
    }
}


/* =====================================================
   MENSAJE
===================================================== */

.message{
    position:relative;

    z-index:10;

    margin-top:-48px;

    text-align:center;

    opacity:0;

    animation:
        messageAppear
        1.8s
        ease
        1.8s
        forwards;
}

.message p{
    font-size:17px;

    font-weight:300;

    letter-spacing:7px;

    color:#fff9e8;

    text-shadow:
        0 0 8px rgba(255,255,255,.35),
        0 0 25px rgba(255,215,110,.30);
}

.message span{
    display:block;

    margin-top:14px;

    font-size:21px;

    opacity:.84;
}

@keyframes messageAppear{

    from{
        opacity:0;

        transform:
            translateY(15px);
    }

    to{
        opacity:1;

        transform:
            translateY(0);
    }
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:600px){

    .bouquet-wrapper{
        width:430px;
        max-width:97vw;

        height:540px;
    }

    .bouquet-glow{
        width:360px;
        height:360px;
    }

    .retro-sun{
        width:330px;
        height:330px;

        bottom:115px;
    }

    .message{
        margin-top:-28px;
    }

    .message p{
        font-size:14px;
        letter-spacing:5px;
    }

    .retro-grid{
        opacity:.09;
    }

}

</style>
